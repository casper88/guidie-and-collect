name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test CLIs
        run: |
          python -m guidie_collect.autolabel \
            schema/examples/plug_insertion.plan.json \
            schema/examples/plug_insertion.capture.json \
            -o /tmp/ep_0002.episode.json
          python -m guidie_collect.validate \
            schema/examples/plug_insertion.episode.json \
            --plan schema/examples/plug_insertion.plan.json
